name: Ruff

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ruff:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check .
