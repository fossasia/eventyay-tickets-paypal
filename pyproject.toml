[project]
name = "eventyay-paypal"
dynamic = ["version"]
description = "Integrates eventyay-tickets with paypal"
readme = "README.rst"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["eventyay-tickets", "eventyay_paypal", "paypal", "eventyay"]
authors = [
    {name = "eventyay team", email = "support@eventyay.com"},
]
maintainers = [
    {name = "eventyay team", email = "support@eventyay.com"},
]

dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
]

[project.entry-points."pretix.plugin"]
eventyay_paypal = "eventyay_paypal:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/fossasia/eventyay-tickets"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "eventyay_paypal.__version__"}

[tool.setuptools.packages.find]
include = ["eventyay*"]
namespaces = false

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
